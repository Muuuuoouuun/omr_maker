          PLAYWRIGHT_BASE_URL: ${{ secrets.OMR_STAGING_BASE_URL }}
          OMR_STUDENT_CREDENTIAL_HOSTED_MODE: "1"
          OMR_STUDENT_CREDENTIAL_APPROVED_ORIGIN: ${{ secrets.OMR_STAGING_BASE_URL }}
          OMR_PRODUCTION_ORIGIN: ${{ secrets.OMR_PRODUCTION_BASE_URL }}
          OMR_STUDENT_CREDENTIAL_ALLOW_MUTATION: "1"
          OMR_STUDENT_CREDENTIAL_NON_PRODUCTION: "1"
          OMR_STUDENT_CREDENTIAL_FIXTURE_ID: ${{ secrets.OMR_STUDENT_CREDENTIAL_FIXTURE_ID }}
          OMR_STUDENT_CREDENTIAL_STUDENT_IDS: ${{ secrets.OMR_STUDENT_CREDENTIAL_STUDENT_IDS }}
          OMR_STUDENT_CREDENTIAL_STUDENT_NAMES: ${{ secrets.OMR_STUDENT_CREDENTIAL_STUDENT_NAMES }}
          OMR_STUDENT_CREDENTIAL_EXPECTED_ESCAPED_NAME: ${{ secrets.OMR_STUDENT_CREDENTIAL_EXPECTED_ESCAPED_NAME }}
          OMR_STUDENT_CREDENTIAL_GROUP_ID: ${{ secrets.OMR_STUDENT_CREDENTIAL_GROUP_ID }}
          OMR_STUDENT_CREDENTIAL_INVITE_URL: ${{ secrets.OMR_STUDENT_CREDENTIAL_INVITE_URL }}
          OMR_STUDENT_CREDENTIAL_TEACHER_LOGIN: ${{ secrets.OMR_STUDENT_CREDENTIAL_TEACHER_LOGIN }}
          OMR_STUDENT_CREDENTIAL_TEACHER_PASSWORD: ${{ secrets.OMR_STUDENT_CREDENTIAL_TEACHER_PASSWORD }}
          OMR_STUDENT_CREDENTIAL_FIXTURE_CLEANUP_URL: ${{ secrets.OMR_STUDENT_CREDENTIAL_FIXTURE_CLEANUP_URL }}
          OMR_STUDENT_CREDENTIAL_FIXTURE_CLEANUP_TOKEN: ${{ secrets.OMR_STUDENT_CREDENTIAL_FIXTURE_CLEANUP_TOKEN }}
        run: |
          set -euo pipefail
          export OMR_PRODUCTION_ASSET_GC_PAUSED_REF="asset-gc-paused:$STAGING_HOST"
          PRIVATE_PREVIEW_DIR="$RUNNER_TEMP/initial-operations-private-preview"
          mkdir -m 700 "$PRIVATE_PREVIEW_DIR"
          export PRIVATE_PREVIEW_DIR
          npm run ops:verify:production -- \
            --confirm-production-host="$STAGING_HOST" \
            --output="$PRIVATE_PREVIEW_DIR/hosted-preview.json" > "$PRIVATE_PREVIEW_DIR/command.log" 2>&1
          PLAYWRIGHT_JSON_OUTPUT_NAME="$PRIVATE_PREVIEW_DIR/production-build-e2e.json" \
            npm run test:e2e:prod -- --workers=1 --retries=0 --reporter=json \
            > "$PRIVATE_PREVIEW_DIR/production-build-e2e.log" \
            2> "$PRIVATE_PREVIEW_DIR/production-build-e2e.stderr"
          npx playwright test e2e/student-credential-batch.spec.ts \
            --project=student-credential-chromium --workers=1 --retries=0 --reporter=json \
            > "$PRIVATE_PREVIEW_DIR/hosted-e2e.json" 2> "$PRIVATE_PREVIEW_DIR/hosted-e2e.stderr"
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync, writeFileSync } from "node:fs";
          import { join } from "node:path";
          import { deriveHostedBrowserReleaseProofs } from "./scripts/browser-release-proof-core.mjs";
          const bytes = readFileSync(join(process.env.PRIVATE_PREVIEW_DIR, "hosted-preview.json"));
          const preview = JSON.parse(bytes.toString("utf8"));
          const expectedProjectHash = createHash("sha256").update(process.env.STAGING_PROJECT_REF).digest("hex");
          if (preview.status !== "verified" || preview.build !== process.env.OMR_PRODUCTION_EXPECTED_BUILD
            || preview.releaseIdentity?.deployedSha !== process.env.OMR_PRODUCTION_EXPECTED_BUILD
            || preview.releaseIdentity?.verifierSha !== process.env.OMR_PRODUCTION_EXPECTED_BUILD
            || preview.releaseIdentity?.previewDeploymentId !== process.env.OMR_PRODUCTION_PREVIEW_DEPLOYMENT_ID
            || preview.releaseIdentity?.previewArtifactDigest !== process.env.OMR_PRODUCTION_PREVIEW_ARTIFACT_DIGEST
            || preview.releaseIdentity?.previewIdentityAttested !== true
            || preview.readinessVersion !== process.env.OMR_PRODUCTION_EXPECTED_READINESS_VERSION
            || preview.databaseProjectRefHash !== expectedProjectHash
            || preview.access?.anon !== "denied" || preview.access?.authenticated !== "denied"
            || preview.provisionedTeacherCanary !== "ready"
            || preview.staticAssetCompression?.statusCode !== 200
            || !["br", "gzip"].includes(preview.staticAssetCompression?.encoding)
            || preview.staticAssetCompression?.cachePolicy !== "immutable"
            || preview.assetGcBootstrap?.observability !== "ready") throw new Error("unverified");
          writeFileSync(join(process.env.RELEASE_DIR, "sources/source-hosted.json"), `${JSON.stringify({
            schemaVersion: 1, id: "hosted", status: "verified",
            buildSha: process.env.OMR_PRODUCTION_EXPECTED_BUILD,
            environmentDigest: process.env.ENVIRONMENT_DIGEST,
            sourceSha256: createHash("sha256").update(bytes).digest("hex"),
            metrics: { anonDenied: true, authenticatedDenied: true, boundary: "passed",
              cleanupHeartbeatFresh: "passed", deliveryProbe: "passed", healthSha: "passed", immutablePreview: "passed",
              readinessExact: "passed", staticCompression: "passed", teacherCanary: "passed" },
          })}\n`, { encoding: "utf8", mode: 0o600, flag: "wx" });
          const localBytes = readFileSync(join(process.env.PRIVATE_EVIDENCE_DIR, "browser-local-metrics.json"));
          const local = JSON.parse(localBytes.toString("utf8"));
          const productionBytes = readFileSync(join(process.env.PRIVATE_PREVIEW_DIR, "production-build-e2e.json"));
          const production = JSON.parse(productionBytes.toString("utf8"));
          const hostedBytes = readFileSync(join(process.env.PRIVATE_PREVIEW_DIR, "hosted-e2e.json"));
          const hosted = JSON.parse(hostedBytes.toString("utf8"));
          const hostedProofs = deriveHostedBrowserReleaseProofs({ hostedReports: [hostedBytes] });
          const productionStats = production.stats;
          const hostedStats = hosted.stats;
          const productionProjects = (production.config?.projects ?? []).map((project) => project.name).sort();
          if (local.schemaVersion !== 1 || local.status !== "verified"
            || local.buildSha !== process.env.OMR_PRODUCTION_EXPECTED_BUILD
            || local.environmentDigest !== process.env.ENVIRONMENT_DIGEST
            || !/^[a-f0-9]{64}$/.test(local.sourceSha256)
            || !productionStats || !Number.isSafeInteger(productionStats.expected) || productionStats.expected < 1
            || productionStats.unexpected !== 0 || productionStats.flaky !== 0 || productionStats.skipped !== 0
            || production.config?.workers !== 1 || !Array.isArray(production.config?.projects)
            || productionProjects.join(",") !== "prod-chromium,prod-webkit-ipad"
            || production.config.projects.some((project) => project.retries !== 0)
            || !hostedStats || !Number.isSafeInteger(hostedStats.expected) || hostedStats.expected < 1
            || hostedStats.unexpected !== 0 || hostedStats.flaky !== 0 || hostedStats.skipped !== 0
            || hosted.config?.workers !== 1 || !Array.isArray(hosted.config?.projects)
            || hosted.config.projects.length !== 1 || hosted.config.projects[0].retries !== 0
            || !JSON.stringify(hosted.suites ?? []).includes("student-credential-batch.spec.ts")) {
            throw new Error("unverified");
          }
          const metrics = { ...local.metrics, hostedExpected: hostedStats.expected, hostedFlaky: 0, hostedProofs,
            hostedSkipped: 0, hostedUnexpected: 0, productionExpected: productionStats.expected,
            productionFlaky: 0, productionProjects, productionSkipped: 0, productionUnexpected: 0,
          };
          writeFileSync(join(process.env.RELEASE_DIR, "sources/source-browser.json"), `${JSON.stringify({
            schemaVersion: 1, id: "browser", status: "verified",
            buildSha: process.env.OMR_PRODUCTION_EXPECTED_BUILD,
            environmentDigest: process.env.ENVIRONMENT_DIGEST,
            sourceSha256: createHash("sha256")
              .update(`${local.sourceSha256}\n${createHash("sha256").update(productionBytes).digest("hex")}\n${createHash("sha256").update(hostedBytes).digest("hex")}\n`)
              .digest("hex"), metrics,
          })}\n`, { encoding: "utf8", mode: 0o600, flag: "wx" });
          NODE

      - name: Run exact 80 + 10 + 10 initial workload
        env:
          OMR_INITIAL_OPS_LOAD_ENABLED: "1"
          OMR_INITIAL_OPS_STAGING_URL: ${{ secrets.OMR_STAGING_BASE_URL }}
          OMR_PRODUCTION_BASE_URL: ${{ secrets.OMR_PRODUCTION_BASE_URL }}
          OMR_INITIAL_OPS_STAGING_SUPABASE_URL: ${{ secrets.OMR_STAGING_SUPABASE_URL }}
          OMR_PRODUCTION_SUPABASE_URL: ${{ secrets.OMR_PRODUCTION_SUPABASE_URL }}
          OMR_INITIAL_OPS_TOKEN: ${{ secrets.OMR_INITIAL_OPS_TOKEN }}
          OMR_READINESS_TOKEN: ${{ secrets.OMR_READINESS_TOKEN }}
          OMR_INITIAL_OPS_EXPECTED_BUILD: ${{ inputs.build_sha }}
          OMR_INITIAL_OPS_RUN_ID: initial-${{ github.run_id }}-${{ github.run_attempt }}
          OMR_INITIAL_OPS_RUN_CHALLENGE: ${{ secrets.OMR_INITIAL_OPS_RUN_CHALLENGE }}
          OMR_STAGING_DB_HOST: ${{ secrets.OMR_STAGING_DB_HOST }}
          OMR_STAGING_DB_PORT: ${{ secrets.OMR_STAGING_DB_PORT }}
          OMR_STAGING_DB_USER: ${{ secrets.OMR_STAGING_DB_USER }}
          OMR_STAGING_DB_NAME: ${{ secrets.OMR_STAGING_DB_NAME }}
          OMR_STAGING_DB_PASSWORD: ${{ secrets.OMR_STAGING_DB_PASSWORD }}
        run: |
          set -euo pipefail
          export OMR_INITIAL_OPS_COLLECTOR_MODULE="$GITHUB_WORKSPACE/scripts/initial-operations-http-collectors.mjs"
          PRIVATE_LOAD_DIR="$RUNNER_TEMP/initial-operations-private-load"
          test ! -e "$PRIVATE_LOAD_DIR"
          npm run test:ops:initial -- --run \
            --confirm-staging-host="$STAGING_HOST" \
            --confirm-load-fixture="initial-ops-100" \
            --output="$PRIVATE_LOAD_DIR" > "$PRIVATE_EVIDENCE_DIR/initial-load-command.log" 2>&1
          DEAD_QUEUE_COUNT="$(PGPASSWORD="$OMR_STAGING_DB_PASSWORD" "$OMR_POSTGRES_BIN/psql" \
            "host=$OMR_STAGING_DB_HOST port=$OMR_STAGING_DB_PORT user=$OMR_STAGING_DB_USER dbname=$OMR_STAGING_DB_NAME sslmode=require" \
            -X -A -t -v ON_ERROR_STOP=1 \
            -c "select count(*)::text from public.omr_remote_asset_cleanup_queue where status = 'dead'")"
          test "$DEAD_QUEUE_COUNT" = "0"
          export DEAD_QUEUE_COUNT
          export PRIVATE_LOAD_DIR
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync, writeFileSync } from "node:fs";
          import { join } from "node:path";
          import { evaluateInitialOperationsEvidenceBundle } from "./scripts/initial-operations-evidence-bundle.mjs";
          import { INITIAL_OPERATIONS_GATE } from "./scripts/initial-operations-core.mjs";
          const bytes = readFileSync(join(process.env.PRIVATE_LOAD_DIR, "manifest.json"));
          const commandLog = readFileSync(join(process.env.PRIVATE_EVIDENCE_DIR, "initial-load-command.log"), "utf8");
          for (const name of ["OMR_INITIAL_OPS_TOKEN", "OMR_READINESS_TOKEN", "OMR_INITIAL_OPS_RUN_CHALLENGE", "OMR_STAGING_DB_PASSWORD"]) {
            const secret = process.env[name];
            if (!secret || commandLog.includes(secret)) throw new Error("unverified");
          }
          if (/authorization\s*[:=]|service[_-]?role|student[_-]?answer|raw[_-]?provider/i.test(commandLog)) throw new Error("unverified");
          const manifest = JSON.parse(bytes.toString("utf8"));
          const expectedProjectHash = createHash("sha256").update(process.env.STAGING_PROJECT_REF).digest("hex");
          if (manifest.schemaVersion !== 2 || manifest.closed !== true
            || manifest.fixture !== "initial-ops-100"
            || manifest.target?.build !== process.env.OMR_INITIAL_OPS_EXPECTED_BUILD
            || manifest.target?.databaseProjectRefHash !== expectedProjectHash) throw new Error("unverified");
          const evaluation = await evaluateInitialOperationsEvidenceBundle(process.env.PRIVATE_LOAD_DIR, {
            expectedBuild: process.env.OMR_INITIAL_OPS_EXPECTED_BUILD,
            expectedDatabaseProjectRefHash: expectedProjectHash,
          });
          if (evaluation.status !== "passed" || evaluation.failures?.length !== 0) throw new Error("unverified");
          const evidence = {
            schemaVersion: 1, id: "load", status: "verified",
            buildSha: process.env.OMR_INITIAL_OPS_EXPECTED_BUILD,
            environmentDigest: process.env.ENVIRONMENT_DIGEST,
            sourceSha256: createHash("sha256")
              .update(`${createHash("sha256").update(bytes).digest("hex")}\n${createHash("sha256").update(commandLog).digest("hex")}\n${process.env.DEAD_QUEUE_COUNT}\n`)
              .digest("hex"),
            metrics: { cleanupVerified: true,
              concurrentMaxPdfUploads: INITIAL_OPERATIONS_GATE.concurrentMaxPdfUploads,
              concurrentSubmissions: INITIAL_OPERATIONS_GATE.concurrentSubmissions,
              deadQueueCount: Number(process.env.DEAD_QUEUE_COUNT), failures: 0,
              gatewayReadP95Ms: evaluation.metrics.gatewayReadP95Ms,
              logRedaction: "passed", maximumQueryMs: evaluation.metrics.maximumQueryMs, status: "passed",
              students: INITIAL_OPERATIONS_GATE.students,
              submitEndToEndP99Ms: evaluation.metrics.submitEndToEndP99Ms,
              submitRpcP95Ms: evaluation.metrics.submitRpcP95Ms,
              teacherLivePollers: INITIAL_OPERATIONS_GATE.teacherLivePollers,
              teacherUploaders: INITIAL_OPERATIONS_GATE.teacherUploaders,
              virtualUsers: INITIAL_OPERATIONS_GATE.virtualUsers },
          };
          writeFileSync(join(process.env.RELEASE_DIR, "sources/source-load.json"), `${JSON.stringify(evidence)}\n`, {
            encoding: "utf8", mode: 0o600, flag: "wx",
          });
          NODE

      - name: Exercise external alert roundtrip
        env:
          OMR_BUILD_SHA: ${{ inputs.build_sha }}
          OMR_ALERT_SINK_URL: ${{ secrets.OMR_ALERT_SINK_URL }}
          OMR_ALERT_RECEIPT_URL: ${{ secrets.OMR_ALERT_RECEIPT_URL }}
          OMR_ALERT_ACK_URL: ${{ secrets.OMR_ALERT_ACK_URL }}
          OMR_ALERT_RESOLVE_URL: ${{ secrets.OMR_ALERT_RESOLVE_URL }}
          OMR_ALERT_SINK_TOKEN: ${{ secrets.OMR_ALERT_SINK_TOKEN }}
          OMR_ALERT_RECEIPT_TOKEN: ${{ secrets.OMR_ALERT_RECEIPT_TOKEN }}
          OMR_ALERT_ACK_TOKEN: ${{ secrets.OMR_ALERT_ACK_TOKEN }}
          OMR_ALERT_RESOLVE_TOKEN: ${{ secrets.OMR_ALERT_RESOLVE_TOKEN }}
          OMR_ALERT_EVIDENCE_HMAC_SECRET: ${{ secrets.OMR_ALERT_EVIDENCE_HMAC_SECRET }}
          OMR_ALERT_POLL_INTERVAL_MS: "1000"
          OMR_ALERT_DEADLINE_MS: "120000"
          OMR_ALERT_REQUEST_TIMEOUT_MS: "10000"
        run: |
          set -euo pipefail
          ALERT_EVIDENCE="$PRIVATE_EVIDENCE_DIR/operational-alert.json"
          npm run ops:alert:verify -- --output "$ALERT_EVIDENCE" > "$PRIVATE_EVIDENCE_DIR/operational-alert-command.log" 2>&1
          export ALERT_EVIDENCE
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync, writeFileSync } from "node:fs";
          import { join } from "node:path";
          const bytes = readFileSync(process.env.ALERT_EVIDENCE);
          const value = JSON.parse(bytes.toString("utf8"));
          const canonicalTime = (candidate) => typeof candidate === "string"
            && new Date(candidate).toISOString() === candidate ? Date.parse(candidate) : Number.NaN;
          const times = [value.emittedAt, value.sinkReceivedAt, value.alertReceivedAt,
            value.acknowledgedAt, value.resolvedAt, value.verifiedAt].map(canonicalTime);
          if (value.schemaVersion !== 1 || value.status !== "verified"
            || value.buildSha !== process.env.OMR_BUILD_SHA
            || typeof value.eventId !== "string" || !/^[A-Za-z0-9._:-]{8,200}$/.test(value.eventId)
            || times.some((time) => !Number.isFinite(time))
            || times.some((time, index) => index > 0 && time < times[index - 1])
            || Object.keys(value.endpointOriginHashes ?? {}).sort().join(",") !== "acknowledge,receipt,resolve,sink"
            || Object.values(value.endpointOriginHashes).some((digest) => !/^[a-f0-9]{64}$/.test(digest))
            || !/^sha256:[a-f0-9]{64}$/.test(value.integrity)
            || !/^hmac-sha256:[a-f0-9]{64}$/.test(value.attestation)) throw new Error("unverified");
          writeFileSync(join(process.env.RELEASE_DIR, "sources/source-alert.json"), `${JSON.stringify({
            schemaVersion: 1, id: "alert", status: "verified", buildSha: process.env.OMR_BUILD_SHA,
            environmentDigest: process.env.ENVIRONMENT_DIGEST,
            sourceSha256: createHash("sha256").update(bytes).digest("hex"),
            metrics: { alertAck: "passed", alertResolve: "passed", roundtrip: "passed", sinkReceipt: "passed" },
          })}\n`, { encoding: "utf8", mode: 0o600, flag: "wx" });
          NODE

      - name: Create staging backup
        env:
          OMR_BUILD_SHA: ${{ inputs.build_sha }}
          SUPABASE_URL: ${{ secrets.OMR_STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.OMR_STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_HOST: ${{ secrets.OMR_STAGING_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.OMR_STAGING_DB_PORT }}
          SUPABASE_DB_USER: ${{ secrets.OMR_STAGING_DB_USER }}
          SUPABASE_DB_NAME: ${{ secrets.OMR_STAGING_DB_NAME }}
          SUPABASE_DB_PASSWORD: ${{ secrets.OMR_STAGING_DB_PASSWORD }}
        run: |
          set -euo pipefail
          BACKUP_DIR="$RUNNER_TEMP/initial-operations-private-backup"
          test ! -e "$BACKUP_DIR"
          npm run ops:backup:create -- \
            --confirm-source-project-ref="$STAGING_PROJECT_REF" \
            --confirm-writes-paused="$STAGING_PROJECT_REF" \
            --confirm-asset-gc-paused="$STAGING_PROJECT_REF" \
            --output="$BACKUP_DIR" > "$PRIVATE_EVIDENCE_DIR/backup-command.log" 2>&1
          test -f "$BACKUP_DIR/.COMPLETE"
          export BACKUP_DIR
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync, writeFileSync } from "node:fs";
          import { join } from "node:path";
          const manifest = readFileSync(join(process.env.BACKUP_DIR, "manifest.json"));
          const parsed = JSON.parse(manifest.toString("utf8"));
          const complete = readFileSync(join(process.env.BACKUP_DIR, ".COMPLETE"));
          const expectedProjectHash = createHash("sha256").update(process.env.STAGING_PROJECT_REF).digest("hex");
          if (parsed.gitCommit !== process.env.OMR_BUILD_SHA
            || parsed.sourceProjectRefHash !== expectedProjectHash) throw new Error("unverified");
          if (typeof parsed.createdAt !== "string" || new Date(parsed.createdAt).toISOString() !== parsed.createdAt) throw new Error("unverified");
          writeFileSync(join(process.env.RELEASE_DIR, "sources/source-backup.json"), `${JSON.stringify({
            schemaVersion: 1, id: "backup", status: "verified",
            buildSha: process.env.OMR_BUILD_SHA,
            environmentDigest: process.env.ENVIRONMENT_DIGEST,
            sourceSha256: createHash("sha256").update(Buffer.concat([manifest, complete])).digest("hex"),
            metrics: { backup: "verified", createdAt: parsed.createdAt },
          })}\n`, { encoding: "utf8", mode: 0o600, flag: "wx" });
          NODE
          printf 'BACKUP_DIR=%s\n' "$BACKUP_DIR" >> "$GITHUB_ENV"

      - name: Apply backup to disposable restore target
        env:
          OMR_BUILD_SHA: ${{ inputs.build_sha }}
          OMR_DEPLOYMENT_TIER: staging
          OMR_RESTORE_EXPECTED_BUILD: ${{ inputs.build_sha }}
          OMR_PRODUCTION_SUPABASE_URL: ${{ secrets.OMR_PRODUCTION_SUPABASE_URL }}
          OMR_PRODUCTION_APP_URL: ${{ secrets.OMR_PRODUCTION_BASE_URL }}
          OMR_RESTORE_TARGET_APP_URL: ${{ secrets.OMR_RESTORE_TARGET_APP_URL }}
          OMR_RESTORE_TARGET_SUPABASE_URL: ${{ secrets.OMR_RESTORE_TARGET_SUPABASE_URL }}
          OMR_RESTORE_TARGET_SERVICE_ROLE_KEY: ${{ secrets.OMR_RESTORE_TARGET_SERVICE_ROLE_KEY }}
          OMR_RESTORE_TARGET_DB_HOST: ${{ secrets.OMR_RESTORE_TARGET_DB_HOST }}
          OMR_RESTORE_TARGET_DB_PORT: ${{ secrets.OMR_RESTORE_TARGET_DB_PORT }}
          OMR_RESTORE_TARGET_DB_USER: ${{ secrets.OMR_RESTORE_TARGET_DB_USER }}
          OMR_RESTORE_TARGET_DB_NAME: ${{ secrets.OMR_RESTORE_TARGET_DB_NAME }}
          OMR_RESTORE_TARGET_DB_PASSWORD: ${{ secrets.OMR_RESTORE_TARGET_DB_PASSWORD }}
        run: |
          set -euo pipefail
          PRIVATE_RESTORE_DIR="$RUNNER_TEMP/initial-operations-private-restore"
          test ! -e "$PRIVATE_RESTORE_DIR"
          mkdir -m 700 "$PRIVATE_RESTORE_DIR" "$PRIVATE_RESTORE_DIR/verification"
          RESTORE_STARTED_AT="$(node -e 'process.stdout.write(new Date().toISOString())')"
          export OMR_RESTORE_EXPECTED_BOUNDARY_SHA256="$RESTORE_BOUNDARY_SHA256"
          node scripts/apply-backup-to-restore-target.mjs \
            --apply \
            --backup="$BACKUP_DIR" \
            --output-dir="$PRIVATE_RESTORE_DIR/verification" \
            --confirm-target-project-ref="$RESTORE_PROJECT_REF" \
            --confirm-boundary-sha256="$RESTORE_BOUNDARY_SHA256" \
            --started-at="$RESTORE_STARTED_AT" \
            > "$PRIVATE_RESTORE_DIR/prepare-result.json" \
            2> "$PRIVATE_RESTORE_DIR/prepare-command.stderr"
          test "$(stat -c %s "$PRIVATE_RESTORE_DIR/prepare-result.json")" -ge 2
          test "$(stat -c %s "$PRIVATE_RESTORE_DIR/prepare-result.json")" -le 65536
          test -f "$PRIVATE_RESTORE_DIR/verification/.INCOMPLETE"
          test ! -e "$PRIVATE_RESTORE_DIR/verification/.RESTORE_COMPLETE"
          export PRIVATE_RESTORE_DIR
          export RESTORE_STARTED_AT
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { appendFileSync, readFileSync } from "node:fs";
          import { join } from "node:path";
          import { parseStrictJson } from "./scripts/strict-json.mjs";
          const manifest = readFileSync(join(process.env.BACKUP_DIR, "manifest.json"));
          const value = parseStrictJson(readFileSync(join(process.env.PRIVATE_RESTORE_DIR, "prepare-result.json"), "utf8"));
          const keys = Object.keys(value ?? {}).sort();
          const expected = ["backupManifestSha256", "boundarySha256", "buildSha", "completedAt", "environmentDigest",
            "schemaVersion", "status", "storageBytes", "storageObjectCount", "targetDigest", "targetProjectRefHash"].sort();
          if (keys.length !== expected.length || keys.some((key, index) => key !== expected[index])
            || value.schemaVersion !== 1 || value.status !== "restored" || value.buildSha !== process.env.OMR_BUILD_SHA
            || !/^[a-f0-9]{64}$/.test(value.environmentDigest)
            || !/^[a-f0-9]{64}$/.test(value.targetDigest)
            || value.boundarySha256 !== process.env.RESTORE_BOUNDARY_SHA256
            || value.backupManifestSha256 !== createHash("sha256").update(manifest).digest("hex")
            || value.targetProjectRefHash !== createHash("sha256").update(process.env.RESTORE_PROJECT_REF).digest("hex")
            || new Date(value.completedAt).toISOString() !== value.completedAt
            || Date.parse(value.completedAt) < Date.parse(process.env.RESTORE_STARTED_AT)
            || Date.parse(value.completedAt) - Date.parse(process.env.RESTORE_STARTED_AT) > 120 * 60_000
            || Date.parse(value.completedAt) > Date.now() + 30_000) throw new Error("unverified");
          appendFileSync(process.env.GITHUB_ENV,
            `RESTORE_ENVIRONMENT_DIGEST=${value.environmentDigest}\nRESTORE_TARGET_DIGEST=${value.targetDigest}\n`);
          NODE
          printf 'PRIVATE_RESTORE_DIR=%s\n' "$PRIVATE_RESTORE_DIR" >> "$GITHUB_ENV"
          printf 'RESTORE_STARTED_AT=%s\n' "$RESTORE_STARTED_AT" >> "$GITHUB_ENV"

      - name: Verify disposable restore and core journey
        env:
          OMR_DEPLOYMENT_TIER: staging
          OMR_RESTORE_TARGET_APP_URL: ${{ secrets.OMR_RESTORE_TARGET_APP_URL }}
          OMR_RESTORE_TARGET_SUPABASE_URL: ${{ secrets.OMR_RESTORE_TARGET_SUPABASE_URL }}
          OMR_RESTORE_TARGET_SERVICE_ROLE_KEY: ${{ secrets.OMR_RESTORE_TARGET_SERVICE_ROLE_KEY }}
          OMR_PRODUCTION_SUPABASE_URL: ${{ secrets.OMR_PRODUCTION_SUPABASE_URL }}
          OMR_PRODUCTION_APP_URL: ${{ secrets.OMR_PRODUCTION_BASE_URL }}
          OMR_RESTORE_TARGET_DB_HOST: ${{ secrets.OMR_RESTORE_TARGET_DB_HOST }}
          OMR_RESTORE_TARGET_DB_PORT: ${{ secrets.OMR_RESTORE_TARGET_DB_PORT }}
          OMR_RESTORE_TARGET_DB_USER: ${{ secrets.OMR_RESTORE_TARGET_DB_USER }}
          OMR_RESTORE_TARGET_DB_NAME: ${{ secrets.OMR_RESTORE_TARGET_DB_NAME }}
          OMR_RESTORE_TARGET_DB_PASSWORD: ${{ secrets.OMR_RESTORE_TARGET_DB_PASSWORD }}
          OMR_RESTORE_EXPECTED_BUILD: ${{ inputs.build_sha }}
        run: |
          set -euo pipefail
          export OMR_RESTORE_EXPECTED_BOUNDARY_SHA256="$RESTORE_BOUNDARY_SHA256"
          npm run ops:restore:verify -- \
            --verify \
            --backup="$BACKUP_DIR" \
            --confirm-target-project-ref="$RESTORE_PROJECT_REF" \
            --started-at="$RESTORE_STARTED_AT" \
            --rpo-minutes=60 \
            --rto-minutes=120 \
            --output="$PRIVATE_RESTORE_DIR/verification/restore-evidence.json" \
            > "$PRIVATE_RESTORE_DIR/restore-command.log" 2>&1
          test -f "$PRIVATE_RESTORE_DIR/verification/.RESTORE_COMPLETE"
          test ! -e "$PRIVATE_RESTORE_DIR/verification/.INCOMPLETE"
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync, writeFileSync } from "node:fs";
          import { join } from "node:path";
          const result = readFileSync(join(process.env.PRIVATE_RESTORE_DIR, "verification/restore-evidence.json"));
          const complete = readFileSync(join(process.env.PRIVATE_RESTORE_DIR, "verification/.RESTORE_COMPLETE"));
          const prepare = readFileSync(join(process.env.PRIVATE_RESTORE_DIR, "prepare-result.json"));
          const value = JSON.parse(result.toString("utf8"));
          if (value.status !== "verified" || value.environment !== "staging"
            || value.buildSha !== process.env.OMR_RESTORE_EXPECTED_BUILD
            || value.environmentDigest !== process.env.RESTORE_ENVIRONMENT_DIGEST
            || value.targetDigest !== process.env.RESTORE_TARGET_DIGEST
            || value.restoreStartedAt !== process.env.RESTORE_STARTED_AT
            || value.boundaryContract !== "passed" || value.browserSmoke !== "passed"
            || value.disposableCredentialsRevoked !== true || value.completeMarker !== ".RESTORE_COMPLETE"
            || typeof value.backupAgeMinutes !== "number" || value.backupAgeMinutes < 0 || value.backupAgeMinutes > 60
            || typeof value.recoveryMinutes !== "number" || value.recoveryMinutes < 0 || value.recoveryMinutes > 120) {
            throw new Error("unverified");
          }
          writeFileSync(join(process.env.RELEASE_DIR, "sources/source-restore.json"), `${JSON.stringify({
            schemaVersion: 1, id: "restore", status: "verified",
            buildSha: process.env.OMR_RESTORE_EXPECTED_BUILD,
            environmentDigest: process.env.ENVIRONMENT_DIGEST,
            sourceSha256: createHash("sha256").update(Buffer.concat([prepare, result, complete])).digest("hex"),
            metrics: { boundary: "passed", browser: "passed", credentialRevocation: "passed",
              objectHashes: "passed", releaseSeal: "passed", rpo: "passed", rto: "passed",
              tableInventory: "passed" },
          })}\n`, { encoding: "utf8", mode: 0o600, flag: "wx" });
          NODE

      - name: Verify exact-SHA physical Android and iOS evidence
        env:
          OMR_BUILD_SHA: ${{ inputs.build_sha }}
          OMR_PHYSICAL_DEVICE_EVIDENCE_B64: ${{ inputs.physical_device_evidence_b64 }}
          OMR_PHYSICAL_DEVICE_EVIDENCE_SHA256: ${{ inputs.physical_device_evidence_sha256 }}
          OMR_PHYSICAL_DEVICE_EVIDENCE_HMAC_SECRET: ${{ secrets.OMR_PHYSICAL_DEVICE_EVIDENCE_HMAC_SECRET }}
          OMR_PREVIEW_ARTIFACT_DIGEST: ${{ inputs.preview_artifact_digest }}
        run: |
          set -euo pipefail
          node scripts/verify-physical-device-evidence.mjs \
            --output="$EVIDENCE_DIR/raw/physical-device-evidence.json"

      - name: Generate release score
        env:
          OMR_BUILD_SHA: ${{ inputs.build_sha }}
        run: |
          set -euo pipefail
          GENERATED_AT="$(node -e 'process.stdout.write(new Date().toISOString())')"
          node scripts/build-initial-operations-qualification.mjs \
            --build="$OMR_BUILD_SHA" \
            --environment="$ENVIRONMENT_DIGEST" \
            --generated-at="$GENERATED_AT" \
            --preview-host-digest="$QUALIFIED_PREVIEW_HOST_DIGEST" \
            --preview-deployment-id="$QUALIFIED_PREVIEW_DEPLOYMENT_ID" \
            --preview-artifact-digest="$QUALIFIED_PREVIEW_ARTIFACT_DIGEST" \
            --release="$RELEASE_DIR"
          test "$(node -e 'const v=require(process.argv[1]);process.stdout.write(v.qualificationPhase)' "$RELEASE_DIR/bundle-index.json")" = "pre_promotion"
          MANIFEST_PATH="$RELEASE_DIR/release-quality-manifest.json"
          SCORE_PATH="$RELEASE_DIR/release-quality-score.json"
          npm run release:score -- --manifest="$MANIFEST_PATH" --output="$SCORE_PATH" \
            > "$PRIVATE_EVIDENCE_DIR/release-score-command.log" 2>&1
          MANIFEST_SHA256="$(sha256sum "$MANIFEST_PATH" | cut -d ' ' -f 1)"
          export MANIFEST_PATH SCORE_PATH MANIFEST_SHA256
          node --input-type=module <<'NODE'
          import { validatePublishedReleaseScore } from "./scripts/score-release-quality.mjs";
          const result = await validatePublishedReleaseScore(process.env.SCORE_PATH, {
            buildSha: process.env.OMR_BUILD_SHA,
            environmentDigest: process.env.ENVIRONMENT_DIGEST,
            manifestSha256: process.env.MANIFEST_SHA256,
            scorerSha: process.env.OMR_BUILD_SHA,
          });
          if (result.status !== "verified" || result.score.status !== "go") throw new Error("unverified");
          NODE

      - name: Clean private qualification material
        if: ${{ always() }}
        run: |
          set -euo pipefail
          rm -rf \
            "$RUNNER_TEMP/initial-operations-private-backup" \
            "$RUNNER_TEMP/initial-operations-private-load" \
            "$RUNNER_TEMP/initial-operations-private-preview" \
            "$RUNNER_TEMP/initial-operations-private-restore" \
            "$RUNNER_TEMP/initial-operations-private-evidence"

      - name: Seal qualification success
        env:
          OMR_BUILD_SHA: ${{ inputs.build_sha }}
          OMR_PHYSICAL_DEVICE_EVIDENCE_SHA256: ${{ inputs.physical_device_evidence_sha256 }}
          OMR_PHYSICAL_DEVICE_EVIDENCE_HMAC_SECRET: ${{ secrets.OMR_PHYSICAL_DEVICE_EVIDENCE_HMAC_SECRET }}
          OMR_PREVIEW_ARTIFACT_DIGEST: ${{ inputs.preview_artifact_digest }}
        run: |
          set -euo pipefail
          test -f "$EVIDENCE_DIR/.INCOMPLETE"
          test -f "$RELEASE_DIR/release-quality-score.json"
          node scripts/verify-physical-device-evidence.mjs \
            --file="$EVIDENCE_DIR/raw/physical-device-evidence.json"
          SCORE_SHA256="$(sha256sum "$RELEASE_DIR/release-quality-score.json" | cut -d ' ' -f 1)"
          node -e 'const fs=require("node:fs");fs.writeFileSync(process.argv[1],JSON.stringify({schemaVersion:1,status:"qualified",qualificationPhase:"pre_promotion",buildSha:process.env.OMR_BUILD_SHA,environmentDigest:process.env.ENVIRONMENT_DIGEST,scoreSha256:process.argv[2],qualifiedAt:new Date().toISOString()})+"\n",{mode:0o600,flag:"wx"});' \
            "$EVIDENCE_DIR/.QUALIFICATION_COMPLETE.tmp" "$SCORE_SHA256"
          chmod 600 "$EVIDENCE_DIR/.QUALIFICATION_COMPLETE.tmp"
          rm "$EVIDENCE_DIR/.INCOMPLETE"
          mv "$EVIDENCE_DIR/.QUALIFICATION_COMPLETE.tmp" "$EVIDENCE_DIR/QUALIFICATION_COMPLETE"
          chmod 600 "$EVIDENCE_DIR/QUALIFICATION_COMPLETE"

      - name: Upload qualification evidence
        id: upload-qualification-evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: initial-operations-qualification-${{ inputs.build_sha }}
          path: ${{ runner.temp }}/initial-operations-qualification
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Record immutable bundle digest
        if: ${{ always() && steps.upload-qualification-evidence.outcome == 'success' }}
        env:
          OMR_BUILD_SHA: ${{ inputs.build_sha }}
          ARTIFACT_DIGEST: ${{ steps.upload-qualification-evidence.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          ENVIRONMENT_SUMMARY="${ENVIRONMENT_DIGEST:-unverified}"
          {
            printf '### Initial operations qualification evidence\n\n'
            printf -- '- bundle: `initial-operations-qualification-%s`\n' "$OMR_BUILD_SHA"
            printf -- '- build SHA: `%s`\n' "$OMR_BUILD_SHA"
            printf -- '- environment digest: `%s`\n' "$ENVIRONMENT_SUMMARY"
            printf -- '- GitHub artifact digest: `%s`\n' "$ARTIFACT_DIGEST"
            printf -- '- cross-runner status: raw evidence only; rebind paths and rerun scorer\n'
          } >> "$GITHUB_STEP_SUMMARY"
