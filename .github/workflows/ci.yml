name: CI

on:
  push:
    branches: [main, "premier0.1"]
  pull_request:
    branches: [main, "premier0.1"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint · Typecheck · Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Production dependency audit
        run: npm audit --package-lock-only --omit=dev --audit-level=high
      - name: Desktop/build dependency audit
        run: node scripts/verify-desktop-dependency-audit.mjs
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests (Vitest)
        run: npm test

  supabase-live-contract:
    name: Live PostgreSQL contract
    runs-on: ubuntu-latest
    needs: lint-and-test
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify live PostgreSQL contract
        run: node scripts/verify-supabase-live.mjs

  desktop-windows-smoke:
    name: Windows packaged Electron smoke
    runs-on: windows-latest
    needs: lint-and-test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install
        run: npm ci
      - name: Package unpacked desktop app
        run: npm run desktop:pack
      - name: Smoke-test packaged runtime
        run: npm run desktop:smoke:packaged

  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E
        run: npm run test:e2e -- --project=chromium
        env:
          CI: "true"
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  ios-webkit-pwa:
    name: iOS WebKit PWA tests
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright WebKit
        run: npx playwright install --with-deps webkit
      - name: Run iOS WebKit PWA E2E
        run: npm run test:e2e:ios-webkit
        env:
          CI: "true"
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-ios-webkit
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  build:
    name: Next.js build · PWA smoke
    runs-on: ubuntu-latest
    needs: lint-and-test
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: PWA smoke
        run: npm run pwa:smoke
