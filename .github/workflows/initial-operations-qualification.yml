          npm run test:supabase:live > "$PRIVATE_EVIDENCE_DIR/live-postgresql.log" 2>&1
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync, writeFileSync } from "node:fs";
          import { join } from "node:path";
          import { parseLivePgReleaseProofSummary } from "./scripts/live-pg-release-proof-core.mjs";
          const logBytes = readFileSync(join(process.env.PRIVATE_EVIDENCE_DIR, "live-postgresql.log"));
          const proofBytes = readFileSync(process.env.OMR_LIVE_PG_PROOF_SUMMARY_PATH);
          const evidence = parseLivePgReleaseProofSummary(proofBytes);
          const sourceSha256 = createHash("sha256")
            .update("live-postgresql.log\0").update(createHash("sha256").update(logBytes).digest("hex"))
            .update("\nlive-pg-release-proofs.json\0").update(createHash("sha256").update(proofBytes).digest("hex"))
            .digest("hex");
          writeFileSync(join(process.env.RELEASE_DIR, "sources/source-live_pg.json"), `${JSON.stringify({
            schemaVersion: 1, id: "live_pg", status: "verified", buildSha: process.env.OMR_BUILD_SHA,
            environmentDigest: process.env.ENVIRONMENT_DIGEST, sourceSha256,
            metrics: { contract: "passed", postgresMajor: 17, ...evidence },
          })}\n`, { encoding: "utf8", mode: 0o600, flag: "wx" });
          NODE

      - name: Verify immutable staging preview
        env:
          OMR_PRODUCTION_BASE_URL: ${{ secrets.OMR_STAGING_BASE_URL }}
          OMR_PRODUCTION_HOST: ${{ secrets.OMR_STAGING_HOST_CONFIRMATION }}
          OMR_PRODUCTION_SUPABASE_URL: ${{ secrets.OMR_STAGING_SUPABASE_URL }}
          OMR_PRODUCTION_SUPABASE_ANON_KEY: ${{ secrets.OMR_STAGING_SUPABASE_ANON_KEY }}
          OMR_PRODUCTION_AUTHENTICATED_JWT: ${{ secrets.OMR_STAGING_AUTHENTICATED_JWT }}
          OMR_PRODUCTION_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.OMR_STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          OMR_READINESS_TOKEN: ${{ secrets.OMR_READINESS_TOKEN }}
          OMR_ASSET_GC_CRON_SECRET: ${{ secrets.OMR_STAGING_ASSET_GC_CRON_SECRET }}
          OMR_PRODUCTION_EXPECTED_BUILD: ${{ inputs.build_sha }}
          VERCEL_GIT_COMMIT_SHA: ${{ inputs.build_sha }}
          GIT_SHA: ${{ inputs.build_sha }}
          OMR_PRODUCTION_PREVIEW_DEPLOYMENT_ID: ${{ inputs.preview_deployment_id }}
          OMR_PRODUCTION_PREVIEW_ARTIFACT_DIGEST: ${{ inputs.preview_artifact_digest }}
          OMR_PRODUCTION_PREVIEW_ATTESTATION_SIGNATURE: ${{ inputs.preview_attestation_signature }}
          OMR_RELEASE_ATTESTATION_SECRET: ${{ secrets.OMR_RELEASE_ATTESTATION_SECRET }}
